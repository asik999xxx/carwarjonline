<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Автоспин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#e8ecef;--card:#fff;--ink:#14181d;--mute:#6a7480;--line:#d3d9de;--acc:#e8442a}
@media(prefers-color-scheme:dark){:root{--bg:#12151a;--card:#1c2128;--ink:#eef1f4;--mute:#8d97a3;--line:#2c333c}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 80px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line)}
header b{font-size:22px;font-variant-numeric:tabular-nums}
header span{color:var(--mute);font-size:13px}
main{padding:14px 16px;max-width:560px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 0;border:0;background:none;color:var(--mute);font:600 14px inherit;font-family:inherit}
nav button.on{color:var(--acc);box-shadow:inset 0 3px var(--acc)}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:700 16px inherit;font-family:inherit}
.btn:disabled{opacity:.4}
.btn.alt{background:var(--ink);color:var(--bg)}
.btn.sm{width:auto;display:inline-block;padding:9px 14px;font-size:14px}
.car{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:14px;border:2px solid var(--line)}
.car .ph{position:relative;aspect-ratio:8/5;background:#9aa4ad}
.car img{width:100%;height:100%;object-fit:cover;display:block}
.car .tag{position:absolute;left:10px;top:10px;padding:4px 10px;border-radius:6px;color:#fff;font-weight:700;font-size:13px}
.car .in{padding:12px 14px}
.car h3{font-size:18px}
.meta{color:var(--mute);font-size:13px;margin:3px 0 10px;display:flex;flex-wrap:wrap;gap:4px 12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid var(--line);vertical-align:-1px;margin-right:4px}
h2{font-size:18px;margin:4px 0 12px}
.hint{color:var(--mute);font-size:13px;margin:10px 0}
.reveal{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.spinning{height:260px;display:grid;place-items:center;font-size:56px;animation:sh .25s infinite}
@keyframes sh{50%{transform:translateX(8px) rotate(3deg)}}
@media(prefers-reduced-motion:reduce){.reveal,.spinning{animation:none}}
</style>
</head>
<body>
<header><div><span>Баланс</span><br><b id="bal"></b></div><span id="cnt"></span></header>
<main id="main"></main>
<nav><button data-t="spin">Спин</button><button data-t="garage">Гараж</button><button data-t="market">Рынок</button></nav>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const hap=t=>{try{tg.HapticFeedback.impactOccurred(t||'light')}catch(e){}};
// brand|model|base price $|tier (1 простая, 2 средняя, 3 топ)
const RAW=`Toyota|Corolla|9000|1;Toyota|Camry|14000|1;Toyota|RAV4|18000|1;Toyota|Land Cruiser 300|60000|3;Toyota|Supra|45000|3;Lexus|IS 250|16000|2;Lexus|RX 350|28000|2;Lexus|LX 600|110000|3;Lexus|LC 500|90000|3;BMW|3 Series|20000|2;BMW|X5|35000|2;BMW|M3|65000|3;BMW|M5|95000|3;BMW|i8|70000|3;Mercedes-Benz|C-Class|22000|2;Mercedes-Benz|E-Class|30000|2;Mercedes-Benz|G-Class|140000|3;Mercedes-Benz|AMG GT|130000|3;Audi|A4|18000|2;Audi|A6|26000|2;Audi|Q7|38000|2;Audi|RS6|110000|3;Audi|R8|150000|3;Volkswagen|Golf|10000|1;Volkswagen|Passat|12000|1;Volkswagen|Tiguan|17000|1;Honda|Civic|10000|1;Honda|Accord|13000|1;Honda|CR-V|16000|1;Nissan|Qashqai|11000|1;Nissan|Skyline GT-R|120000|3;Mazda|Mazda3|10000|1;Mazda|CX-5|17000|1;Mazda|MX-5|22000|2;Ford|Focus|7000|1;Ford|Mustang|40000|3;Hyundai|Solaris|6000|1;Hyundai|Tucson|16000|1;Kia|Rio|6500|1;Kia|Sportage|16000|1;Kia|Stinger|35000|2;Chevrolet|Camaro|42000|3;Chevrolet|Cruze|6000|1;Lada|Granta|4500|0;Lada|Niva|5000|0;Skoda|Octavia|11000|1;Porsche|911|130000|3;Porsche|Cayenne|65000|3;Ferrari|488|280000|3;Lamborghini|Huracan|260000|3;Tesla|Model S|60000|3;Tesla|Model 3|32000|2;Land Rover|Defender|65000|3;Subaru|Impreza WRX|22000|2;Mitsubishi|Lancer Evo|40000|3;Volvo|XC90|32000|2;Renault|Logan|4500|0;Daewoo|Matiz|2500|0;Opel|Astra|5500|0`;
const MODELS=RAW.split(';').map(s=>{const[a,b,c,d]=s.split('|');return{brand:a,model:b,base:+c,tier:+d}});
const COLORS=[['Белый','#f2f2f2',1],['Чёрный','#111',1.03],['Серебристый','#b8bec4',1],['Серый','#6c737a',1],['Красный','#c8202a',1.05],['Синий','#1f4c9a',1],['Зелёный','#2f6b45',.97],['Жёлтый','#e8c21a',1.02],['Оранжевый','#e8762a',1.04],['Коричневый','#6b4a32',.93],['Розовый','#e88aa8',.9]];
const TIERS=[[0,'Хлам','#7a6a5c'],[3000,'Обычная','#6a7480'],[12000,'Хорошая','#2f8f5b'],[35000,'Редкая','#2a6ad8'],[90000,'Эпик','#8a3fd1'],[220000,'Легенда','#e8942a']];
const rar=p=>{let r=TIERS[0];for(const t of TIERS)if(p>=t[0])r=t;return r};
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const money=n=>'$'+Math.round(n).toLocaleString('ru-RU');
const SPIN=2500;
let S;try{S=JSON.parse(localStorage.getItem('carspin'))}catch(e){}
S=S||{bal:10000,garage:[],market:[],id:1,tab:'spin',last:null};
const save=()=>{try{localStorage.setItem('carspin',JSON.stringify(S))}catch(e){}};

const SPINS={cheap:{n:'Джайский спин',cost:1000,w:[.30,.55,.13,.02],d:'Дёшево: в основном простые машины'},mid:{n:'Медиум спин',cost:2500,w:[.05,.55,.30,.10],d:'Золотая середина'},vip:{n:'VIP казахский спин',cost:15000,w:[0,.10,.45,.45],d:'Почти всегда средние и топовые машины'}};
function gen(kind){
  // выпадение: чаще дешёвые, топ редко
  const W=(SPINS[kind]||SPINS.mid).w;let r0=Math.random(),tier=0,acc=0;for(let i=0;i<4;i++){acc+=W[i];if(r0<acc){tier=i;break}tier=3}
  const pool=MODELS.filter(m=>m.tier===tier);const m=pick(pool);
  const used=Math.random()<.8, year=used?Math.floor(rnd(1998,2024)):2025;
  const km=used?Math.floor(Math.pow(Math.random(),.8)*(2026-year)*30000+2000):0;
  const col=pick(COLORS);
  const cond=pick([['Битая',.55],['Среднее',.85],['Хорошее',1],['Отличное',1.12]]);
  const age=2026-year;
  let v=m.base*(used?Math.max(.18,1-age*.045):1.25)*Math.max(.35,1-km/450000)*cond[1]*col[2];
  // классика: старые топ-машины ценятся
  if(m.tier===3&&age>18)v*=1.35;
  v=Math.max(700,Math.round(v/50)*50);
  return{id:S.id++,brand:m.brand,model:m.model,year,km,used,color:col[0],hex:col[1],cond:cond[0],val:v,lock:Math.floor(Math.random()*9999)};
}
const OV={'Toyota Land Cruiser 300':'Toyota Land Cruiser (J300)','Mitsubishi Lancer Evo':'Mitsubishi Lancer Evolution','Mercedes-Benz AMG GT':'Mercedes-AMG GT','Lexus LX 600':'Lexus LX','Lamborghini Huracan':'Lamborghini Huracán','Subaru Impreza WRX':'Subaru WRX','Nissan Skyline GT-R':'Nissan Skyline GT-R'};
let PC={};try{PC=JSON.parse(localStorage.getItem('carphotos'))||{}}catch(e){}
const inflight={};
const big=u=>u.replace(/\/\d+px-/,'/640px-');
async function findPhoto(k){
  if(PC[k])return PC[k];
  if(inflight[k])return inflight[k];
  return inflight[k]=(async()=>{
    const t=OV[k]||k;let u=null;
    try{const j=await(await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(t.replace(/ /g,'_')))).json();if(j.thumbnail)u=big(j.thumbnail.source)}catch(e){}
    if(!u)try{const j=await(await fetch('https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(t+' car')+'&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=640&format=json&origin=*')).json();const p=Object.values(j.query.pages)[0];if(p.thumbnail)u=p.thumbnail.source}catch(e){}
    if(u){PC[k]=u;try{localStorage.setItem('carphotos',JSON.stringify(PC))}catch(e){}}
    return u;
  })();
}
function hydrate(){document.querySelectorAll('img[data-k]:not([data-d])').forEach(async im=>{im.dataset.d=1;const u=await findPhoto(im.dataset.k);if(u)im.src=u})}
const PHOTOS={};/*PHOTOS*/
const slug=k=>k.replace(/[^A-Za-z0-9]+/g,'_');
function imgErr(im){if(!im.dataset.w){im.dataset.w=1;findPhoto(im.dataset.k).then(u=>{im.src=u||im.dataset.fb})}else im.src=im.dataset.fb}
function img(c){
  const fb=`data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 250'><rect width='400' height='250' fill='#9aa4ad'/><path d='M50 160l30-50q10-15 30-15h130q20 0 35 15l40 38q20 3 20 22v12H50z' fill='${c.hex}' stroke='#0006' stroke-width='3'/><circle cx='120' cy='178' r='24' fill='#222'/><circle cx='300' cy='178' r='24' fill='#222'/></svg>`)}`;
  const k=c.brand+' '+c.model;
  return `<img src="${PHOTOS[k]||'photos/'+slug(k)+'.jpg'}" data-k="${k}" data-fb="${fb}" onerror="imgErr(this)" alt="${k}">`;
}
function card(c,act){
  const r=rar(c.val);
  return `<div class="car" style="border-color:${r[2]}"><div class="ph">${img(c)}<span class="tag" style="background:${r[2]}">${r[1]}</span></div><div class="in"><h3>${c.brand} ${c.model}</h3><div class="meta"><span>${c.year}</span><span>${c.used?c.km.toLocaleString('ru-RU')+' км':'новая, 0 км'}</span><span>${c.used?'б/у':'новая'}</span><span><i class="sw" style="background:${c.hex}"></i>${c.color}</span><span>${c.cond}</span></div><div class="row"><span class="price">${money(c.val)}</span>${act||''}</div></div></div>`;
}
function spin(kind){
  const k=SPINS[kind];if(S.bal<k.cost)return;S.bal-=k.cost;hap('medium');
  $('main').innerHTML='<div class="spinning">🎰</div>';render(true);
  setTimeout(()=>{const c=gen(kind);S.last=c;S.garage.unshift(c);hap('heavy');save();render()},900);
}
function sell(id){const i=S.garage.findIndex(c=>c.id===id);if(i<0)return;S.bal+=S.garage[i].val;S.garage.splice(i,1);if(S.last&&S.last.id===id)S.last=null;hap();save();render()}
function sellCheap(){let t=0;S.garage=S.garage.filter(c=>{if(rar(c.val)[0]<12000){t+=c.val;return false}return true});S.bal+=t;save();render()}
function buy(id){const i=S.market.findIndex(c=>c.id===id),c=S.market[i];if(!c||S.bal<c.price)return;S.bal-=c.price;S.market.splice(i,1);delete c.price;S.garage.unshift(c);hap('medium');save();render()}
function refill(){S.market=Array.from({length:5},()=>{const c=gen();c.price=Math.round(c.val*rnd(1.05,1.5)/50)*50;return c});save();render()}
const $=id=>document.getElementById(id);
function render(keep){
  $('bal').textContent=money(S.bal);
  $('cnt').textContent='Машин: '+S.garage.length+' · '+money(S.garage.reduce((a,c)=>a+c.val,0));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  if(keep)return;
  const m=$('main');
  if(S.tab==='spin'){
    m.innerHTML=(S.last?'<div class="reveal">'+card(S.last,`<button class="btn alt sm" onclick="sell(${S.last.id})">Продать</button>`)+'</div>':'<p class="hint">Выбери спин — выпадет случайная машина: от Lada до Ferrari. Чем дороже спин, тем круче шансы. Цена зависит от марки, года, пробега, состояния и цвета.</p>')+
    Object.entries(SPINS).map(([k,v])=>`<button class="btn ${k==='vip'?'':k==='mid'?'alt':'alt'}" style="margin-bottom:10px;${k==='vip'?'background:linear-gradient(90deg,#e8942a,#e8442a)':k==='cheap'?'opacity:.85':''}" onclick="spin('${k}')" ${S.bal<v.cost?'disabled':''}><span class="row"><span style="text-align:left">${v.n}<br><small style="font-weight:500;opacity:.8">${v.d}</small></span><span>${money(v.cost)}</span></span></button>`).join('')+
    (S.bal<SPINS.cheap.cost?'<p class="hint">Не хватает денег. Продай машину из гаража.</p>':'');
  }else if(S.tab==='garage'){
    m.innerHTML=`<h2>Гараж</h2>`+(S.garage.length?`<button class="btn alt" style="margin-bottom:14px" onclick="sellCheap()">Продать всё дешевле $12 000</button>`+S.garage.map(c=>card(c,`<button class="btn sm" onclick="sell(${c.id})">Продать</button>`)).join(''):'<p class="hint">Гараж пуст. Сделай первый спин.</p>');
  }else{
    if(!S.market.length)return refill();
    m.innerHTML=`<h2>Рынок</h2><p class="hint">Здесь можно купить конкретную машину — дороже её реальной цены, зато без случайности.</p>`+S.market.map(c=>card(c,`<button class="btn sm" onclick="buy(${c.id})" ${S.bal<c.price?'disabled':''}>Купить ${money(c.price)}</button>`).replace(money(c.val),'оценка '+money(c.val))).join('')+`<button class="btn alt" onclick="refill()">Обновить список</button>`;
  }
}
let taps=0,tt;$('bal').parentElement.onclick=()=>{taps++;clearTimeout(tt);tt=setTimeout(()=>taps=0,1500);if(taps>=7){taps=0;S.bal+=1000000;hap('heavy');save();render()}};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;save();render()});
render();
</script>
</body>
</html>
